<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script src="audio.js"></script>
<script>
/* ============================================================================
   ATELIER — an interactive vector-line study room
   ----------------------------------------------------------------------------
   Spatial convention
     12 x 12 floor, walls at x = ±6 and z = ±6, ceiling y = 7, floor y = 0
     North wall (z = -6) : workstation + floor-to-ceiling bookcase + door
     West  wall (x = -6) : picture window + curtains + reading nook
     East / South        : deliberately NOT built as walls -- the camera sits in
                           the south-east, so real walls there would occlude the
                           whole room. Only furniture lives on those sides.
     Camera              : 3/4 architectural view from the south-east.
   ============================================================================ */
(function(){
"use strict";

/* ------------------------------------------------------------------ scene */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.localClippingEnabled=true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------- palette */
const C={
  bgD:0xf7f3eb, bgN:0x14161b,
  inkD:0x33302b, inkN:0xede8de,
  wallD:0xfbf8f3, wallN:0x1e2127,
  floorD:0xefe8dc, floorN:0x1b1d22,
  woodD:0xe2c69d, woodN:0x3d3529,
  wood2D:0xc9a778, wood2N:0x332c22,
  wood3D:0xa9804f, wood3N:0x2b251d,
  clothD:0xd07a5c, clothN:0x5c3225,
  cloth2D:0xe6d5c0, cloth2N:0x322d26,
  leafD:0x84a67a, leafN:0x2f4433,
  leaf2D:0x678c63, leaf2N:0x25382a,
  waterD:0xa7d7e7, waterN:0x1c3a46,
  metalD:0xd6d1c7, metalN:0x3a3f47,
  paperD:0xffffff, paperN:0x2b2f37,
  darkD:0x4a463f, darkN:0x8d8878,
  accentD:0xd2603a, accentN:0xe07a52,
  tealD:0x3e8e8a, tealN:0x4fb3ae,
  screen:0x1b2430
};

/* ------------------------------------------------- day / night machinery */
const painted=[];       // colour-swappable fills
const clipped=[];       // materials that the lamp cone clips
function pm(day,night,opts){
  const m=new THREE.MeshBasicMaterial(Object.assign({color:day,polygonOffset:true,
    polygonOffsetFactor:2,polygonOffsetUnits:2},opts||{}));
  m.userData.d=day; m.userData.n=(night===undefined?day:night);
  painted.push(m); clipped.push(m); return m;
}
const MAT   = new THREE.LineBasicMaterial({color:C.inkD});
const MATF  = new THREE.LineBasicMaterial({color:C.inkD,transparent:true,opacity:0.34});
const FILL  = pm(0xffffff,0x000000);
const INK_D = MAT;
/* themed surface materials (referenced everywhere) */
const M = {
  floor : pm(C.floorD,C.floorN),
  wood  : pm(C.woodD ,C.woodN ),
  wood2 : pm(C.wood2D,C.wood2N),
  wood3 : pm(C.wood3D,C.wood3N),
  cloth : pm(C.clothD,C.clothN),
  cloth2: pm(C.cloth2D,C.cloth2N),
  leaf  : pm(C.leafD ,C.leafN ),
  leaf2 : pm(C.leaf2D,C.leaf2N),
  water : pm(C.waterD,C.waterN ,{transparent:true,opacity:.30}),
  metal : pm(C.metalD,C.metalN),
  paper : pm(C.paperD,C.paperN),
  dark  : pm(C.darkD ,C.darkN ),
  accent: pm(C.accentD,C.accentN),
  teal  : pm(C.tealD ,C.tealN )
};
/* screen keeps a dark body in both modes, but its glow is themed */
const M_SCREEN = pm(C.screen,C.screen);
const LINE_GLOW= new THREE.LineBasicMaterial({color:0x7bd88f});
const LEAFLINE = new THREE.LineBasicMaterial({color:C.leafD});
LEAFLINE.userData={d:C.leafD,n:C.leafN}; painted.push(LEAFLINE);
/* a whisper-quiet line weight just for the floor boards */
const FLOORLINE=new THREE.LineBasicMaterial({color:C.inkD,transparent:true,opacity:0.20});
FLOORLINE.userData={d:C.inkD,n:C.inkN}; painted.push(FLOORLINE);

/* ------------------------------------------------------------- helpers */
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function geo(pts){const a=[];for(const p of pts)a.push(V(p[0],p[1],p[2]));return new THREE.BufferGeometry().setFromPoints(a);}
function line(pts,mat){return new THREE.Line(geo(pts),mat||MAT);}
function loop(pts,mat){return new THREE.LineLoop(geo(pts),mat||MAT);}
function put(o,x,y,z,rx,ry,rz,parent){o.position.set(x,y,z);
  if(rx)o.rotation.x=rx; if(ry)o.rotation.y=ry; if(rz)o.rotation.z=rz;
  (parent||scene).add(o); return o;}
function circleXY(r,n,mat){const a=[];n=n||44;for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push([Math.cos(t)*r,Math.sin(t)*r,0]);}return loop(a,mat);}
function circleXZ(r,n,mat){const a=[];n=n||44;for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push([Math.cos(t)*r,0,Math.sin(t)*r]);}return loop(a,mat);}
function rectXY(w,h,mat){return loop([[-w/2,-h/2,0],[w/2,-h/2,0],[w/2,h/2,0],[-w/2,h/2,0]],mat);}
function rectXZ(w,d,mat){return loop([[-w/2,0,-d/2],[w/2,0,-d/2],[w/2,0,d/2],[-w/2,0,d/2]],mat);}
function planeMesh(w,h,mat){return new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);}
function circleMesh(r,mat,n){return new THREE.Mesh(new THREE.CircleGeometry(r,n||44),mat);}
function E(x){return x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function lerp(a,b,t){return a+(b-a)*t;}

/* edge(geometry, fillMaterial) -> group of {solid, ink outline} */
function edge(g,mat,thr){
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(g,mat||FILL));
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,thr===undefined?22:thr),MAT));
  return grp;
}
function box(w,h,d,mat,thr){return edge(new THREE.BoxGeometry(w,h,d),mat,thr);}
/* soft-cornered slab, for cushions / upholstery */
function softBox(w,h,d,r,mat){
  r=r||0.07;
  const x=-w/2,y=-h/2,s=new THREE.Shape();
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSize:r*0.55,
    bevelThickness:r*0.55,bevelSegments:2,curveSegments:3});
  g.translate(0,0,-d/2);
  return edge(g,mat,26);
}
function cyl(rt,rb,h,mat,seg){return edge(new THREE.CylinderGeometry(rt,rb,h,seg||18),mat,22);}
function sph(r,mat){return edge(new THREE.SphereGeometry(r,18,12),mat,20);}

/* soft contact shadows -------------------------------------------------- */
const SHADOW_TEX=(function(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');
  const rg=g.createRadialGradient(64,64,2,64,64,63);
  rg.addColorStop(0,'rgba(0,0,0,.62)');
  rg.addColorStop(.45,'rgba(0,0,0,.30)');
  rg.addColorStop(.78,'rgba(0,0,0,.07)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.needsUpdate=true;return t;
})();
const SHADOW_MATS=[];
function shadow(w,d,x,z,y,rot){
  const m=new THREE.MeshBasicMaterial({map:SHADOW_TEX,transparent:true,opacity:.5,
    depthWrite:false,color:0x2a2622});
  SHADOW_MATS.push(m);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);
  p.rotation.x=-Math.PI/2; if(rot)p.rotation.z=rot;
  p.position.set(x,y===undefined?0.014:y,z);
  p.renderOrder=-2; scene.add(p); return p;
}
function unshadow(w,d,x,z,y,rot){return shadow(w,d,x,z,y,rot);}

/* ============================================================================
   1. ROOM SHELL
   ========================================================================= */
/* floor ---------------------------------------------------------------- */
put(planeMesh(12,12,M.floor),0,0,0,-Math.PI/2,0,0);
put(loop([[-6,0,-6],[6,0,-6],[6,0,6],[-6,0,6]]),0,0.012,0);
/* plank seams run E-W (visually light, do not overpower the drawing) */
for(let z=-5.5;z<6;z+=0.86) put(line([[-6,0.016,z],[6,0.016,z]],FLOORLINE),0,0,0);
/* a couple of long grain strokes for warmth */
for(let i=0;i<7;i++){
  const z=-5.1+i*1.52, x0=-5.6+((i*37)%9)*0.14;
  put(line([[x0,0.018,z],[x0+2.2+((i*53)%7)*0.34,0.018,z]],FLOORLINE),0,0,0);
}

/* north wall (the backdrop) -------------------------------------------- */
put(box(12,7,0.24,M.wall),0,3.5,-6.12);
/* west wall with a window opening and a door opening -------------------- */
const wallShape=new THREE.Shape();
wallShape.moveTo(-6,0);wallShape.lineTo(6,0);wallShape.lineTo(6,7);wallShape.lineTo(-6,7);wallShape.closePath();
const wh=new THREE.Path();   /* window: world z in [-1.9, 1.5] */
wh.moveTo(-1.9,1.15);wh.lineTo(1.5,1.15);wh.lineTo(1.5,4.30);wh.lineTo(-1.9,4.30);wh.closePath();
wallShape.holes.push(wh);
const dh=new THREE.Path();   /* door: world z in [3.65, 5.15] */
dh.moveTo(3.65,0);dh.lineTo(5.15,0);dh.lineTo(5.15,2.58);dh.lineTo(3.65,2.58);dh.closePath();
wallShape.holes.push(dh);
put(edge(new THREE.ExtrudeGeometry(wallShape,{depth:0.24,bevelEnabled:false}),M.wall,20),
    -6,0,0,0,-Math.PI/2,0);

/* baseboards + chair rail (segmented around the door opening) ---------- */
function baseN(){put(box(12,0.3,0.06,M.paper),0,0.15,-5.98);}
baseN();
put(box(0.06,0.3,9.65,M.paper),-5.98,0.15,-1.175);     /* z -6 .. 3.65 */
put(box(0.06,0.3,0.85,M.paper),-5.98,0.15,5.575);      /* z 5.15 .. 6 */
put(box(12,0.09,0.045,M.paper),0,1.06,-5.985);          /* chair rail, north */
put(box(0.045,0.09,5.55,M.paper),-5.985,1.06,-3.225);   /* chair rail, west */
put(box(0.045,0.09,0.85,M.paper),-5.985,1.06,5.575);
put(box(12,0.14,0.08,M.paper),0,6.88,-5.95);            /* cornice */
/* ceiling rim — a faint wireframe so the room reads as a real box */
put(loop([[-6,6.95,-6],[6,6.95,-6],[6,6.95,6],[-6,6.95,6]],MATF),0,0,0);
put(line([[-6,6.95,-6],[-6,6.95,6]],MATF),0,0,0);
put(line([[6,6.95,-6],[6,6.95,6]],MATF),0,0,0);

/* ============================================================================
   2. AREA RUG — ties the workstation and the reading nook together
   ========================================================================= */
const rugG=new THREE.Group(); put(rugG,-0.90,0.016,0.34,-Math.PI/2,0,0);
rugG.add(circleMesh(3.4,M.cloth2));
rugG.add(circleXY(3.4,72));
rugG.add(circleXY(2.86,64));
rugG.add(circleXY(1.16,52));
rugG.add(circleXY(1.02,44));
for(let i=0;i<44;i++){
  const a=i/44*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
  rugG.add(line([[c*2.98,s*2.98,0.004],[c*3.34,s*3.34,0.004]],MATF));
}
scene.add(rugG);

/* ============================================================================
   3. WORKSTATION  (along the north wall, x from -5.35 to -0.65)
   ========================================================================= */
const DESK_Y=0.76, DESK_Z=-5.46;
const wsG=new THREE.Group(); scene.add(wsG);
shadow(5.6,1.5,-3.0,DESK_Z+0.15);

/* desktop slab + under-cabinets ---------------------------------------- */
put(box(4.70,0.055,0.82,M.wood),-3.0,DESK_Y-0.028,DESK_Z,0,0,0,wsG);
put(line([[-5.35,DESK_Y+0.004,DESK_Z-0.41],[-0.65,DESK_Y+0.004,DESK_Z-0.41]]),0,0,0,0,0,0,wsG);
/* back modesty panel */
put(box(4.70,0.52,0.05,M.wood2),-3.0,0.47,DESK_Z-0.38,0,0,0,wsG);

/* left drawer pedestal (3 drawers) */
const pedL=new THREE.Group(); put(pedL,-4.90,0,DESK_Z,0,0,0,wsG);
put(box(1.10,0.70,0.76,M.wood2),0,0.35,0,0,0,0,pedL);
for(let i=0;i<3;i++){
  const y=0.14+i*0.225;
  put(rectXY(1.00,0.16),0,y,0.385,0,0,0,pedL);
  put(box(0.30,0.028,0.03,M.metal),0,y,0.40,0,0,0,pedL);
}
/* right drawer unit (single deep file drawer) */
const pedR=new THREE.Group(); put(pedR,-1.20,0,DESK_Z,0,0,0,wsG);
put(box(1.05,0.70,0.76,M.wood2),0,0.35,0,0,0,0,pedR);
put(rectXY(0.95,0.50),0,0.40,0.385,0,0,0,pedR);
put(box(0.34,0.03,0.03,M.metal),0,0.40,0.40,0,0,0,pedR);

/* a warm runner along the back of the desk ---------------------------- */
put(box(4.60,0.012,0.30,M.cloth2),-3.0,DESK_Y+0.006,DESK_Z-0.24,0,0,0,wsG);

/* ---------------------------------------------------- main display #1 */
const mon1G=new THREE.Group(); put(mon1G,-4.18,DESK_Y,DESK_Z-0.14,0,0,0,wsG);
put(cyl(0.16,0.20,0.02,M.metal,20),0,0.012,0,0,0,0,mon1G);      /* foot   */
put(box(0.075,0.30,0.075,M.metal),0,0.17,0,0,0,0,mon1G);          /* neck   */
const mon1Panel=new THREE.Group(); put(mon1Panel,0,0.60,-0.02,0.06,0,0);mon1G.add(mon1Panel);
mon1Panel.add(box(1.60,0.66,0.05,M.dark));                        /* body   */
const scr1=planeMesh(1.50,0.57,M_SCREEN); put(scr1,0,0.005,0.032);mon1Panel.add(scr1);
const scr1Ink=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.50,0.57)),LINE_GLOW);
put(scr1Ink,0,0.005,0.034);mon1Panel.add(scr1Ink);
/* code lines that grow while typing */
const code1=new THREE.Group(); put(code1,0,0.005,0.036);mon1Panel.add(code1);
const CODE_COLS=[
  'const room = new Scene();','room.light(19, 7);','await desk.coffee();',
  'scene.add(plant, cat,','  aquarium, lavaLamp);','if (tired) takeABreak();',
  'render(room, camera);','// ship it 🚀','let ideas = [];','while (alive) {',
  '  ideas.push(make());','}','export default Atelier;'
];
const code1Lines=[];
for(let i=0;i<CODE_COLS.length;i++){
  const l=line([[-0.70,0.19-i*0.055,0],[0.70,0.19-i*0.055,0]],LINE_GLOW);
  l.scale.x=0.001; l.userData.w=0.30+Math.random()*0.54;
  code1.add(l); code1Lines.push(l);

/* procedurally-stocked shelves --------------------------------------- */
function rnd(n){const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
let seed=7;
function stockRow(x0,x1,y,row,col){
  let x=x0+0.025;
  if(rnd(seed++)>0.80 && x1-x0>0.7){          /* a few books lying flat */
    const n=3+Math.floor(rnd(seed++)*3);
    for(let i=0;i<n;i++){
      const w=0.24+rnd(seed++)*0.07, h=0.032+rnd(seed++)*0.014;
      put(box(w,h,0.20,spine(seed|0)),x+w/2,y+0.02+i*0.043,BOOK_Z,0,0,0,bcG);
    }
    x+=0.36;
  }
  let guard=0;
  while(x<x1-0.07 && guard++<22){
    if(rnd(seed++)<0.055){x+=0.10+((col+row)%3)*0.03;continue;}
    const w=0.030+rnd(seed++)*0.026, h=0.25+rnd(seed++)*0.17;
    put(box(w,h,0.22,spine(seed|0)),x+w/2,y+0.02+h/2,BOOK_Z,0,0,0,bcG);
    x+=w+0.009;
  }
  const r=rnd(seed++);
  if(x<x1-0.24){
    if(r<0.10)      put(cyl(0.05,0.058,0.11,M.teal,14),x+0.10,y+0.075,BOOK_Z,0,0,0,bcG);
    else if(r<0.18) put(sph(0.055,M.accent),x+0.075,y+0.075,BOOK_Z,0,0,0,bcG);
    else if(r<0.25) put(box(0.13,0.17,0.02,M.accent),x+0.09,y+0.11,BOOK_Z+0.10,0,0,0,bcG);
  }
}
for(let c=0;c<4;c++){
  const a=DIV[c]+0.035, b=DIV[c+1]-0.035;
  for(let r=0;r<5;r++) stockRow(a,b,ROWY[r],r,c);
}

function skyTex(night){
  const c=document.createElement('canvas');c.width=4;c.height=256;
  const g=c.getContext('2d'), gr=g.createLinearGradient(0,0,0,256);
  if(night){gr.addColorStop(0,'#0e1522');gr.addColorStop(.5,'#1b2436');gr.addColorStop(1,'#33344a');}
  else{gr.addColorStop(0,'#c3dced');gr.addColorStop(.5,'#e6eff1');gr.addColorStop(1,'#f6f0e2');}
  g.fillStyle=gr;g.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(c);t.needsUpdate=true;return t;
}

  g.add(line([[X+0.03,0.30,3.55],[X+0.03,0.55,3.55]],lm));

function bigPlant(x,z,s,mat){
  const g=new THREE.Group(); put(g,x,0,z,0,((x*7+z*3)%7)*0.3,0);scene.add(g);
  shadow(1.5*s,1.5*s,x,z);
  g.add(cyl(0.20*s,0.15*s,0.34*s,M.wood3,20));
  const potRim=circleXY(0.20*s,20); potRim.rotation.x=-Math.PI/2; potRim.position.y=0.17*s; g.add(potRim);
  for(let i=0;i<13;i++){
    const a=-Math.PI/2+(i-6)*0.30, L=(0.42+((i*11)%6)*0.10)*s, lean=0.35+((i*5)%4)*0.25;
    const st=line([[0,0.16*s,0],[Math.cos(a)*L*0.42,0.16*s+L*0.9,Math.sin(a)*L*0.34]],MATF);
    g.add(st);
    const lf=edge(new THREE.CircleGeometry(0.115*s,7),mat||M.leaf,24);
    lf.position.set(Math.cos(a)*L*0.62,0.16*s+L*1.06,Math.sin(a)*L*0.5);
    lf.rotation.set(-0.5+lean*0.2,a,0.5); g.add(lf);
  }
  return g;
}

  const it=Object.assign({p:0,target:0,rate:1.6,v:0,tv:0,name:'',bold:null,boldClones:[]},cfg);

  items.push(it);return it;
}

let BOLDMAT=null;
if(THREE.LineSegments2&&THREE.LineSegmentsGeometry&&THREE.LineMaterial){
  BOLDMAT=new THREE.LineMaterial({color:0xd2603a,linewidth:3.0});
  BOLDMAT.resolution.set(window.innerWidth,window.innerHeight);
  BOLDMAT.polygonOffset=true;BOLDMAT.polygonOffsetFactor=-6;BOLDMAT.polygonOffsetUnits=-6;
}
function segs(o){
  const pos=o.geometry&&o.geometry.attributes&&o.geometry.attributes.position;
  if(!pos)return null;
  const a=[];
  if(o.isLineSegments){for(let i=0;i<pos.count;i++)a.push(pos.getX(i),pos.getY(i),pos.getZ(i));}
  else if(o.isLine||o.isLineLoop){
    const n=pos.count;
    for(let i=0;i<n-1;i++)a.push(pos.getX(i),pos.getY(i),pos.getZ(i),pos.getX(i+1),pos.getY(i+1),pos.getZ(i+1));
    if(o.isLineLoop&&n>2)a.push(pos.getX(n-1),pos.getY(n-1),pos.getZ(n-1),pos.getX(0),pos.getY(0),pos.getZ(0));
  } else return null;
  return a;
}
function boldify(root,out){
  const targets=[];
  root.traverse(o=>{if((o.isLine||o.isLineLoop||o.isLineSegments)&&!o.userData.noBold)targets.push(o);});
  targets.forEach(o=>{
    if(o.isLineSegments2)return;
    const s=segs(o); if(!s||!s.length)return;
    const g=new THREE.LineSegmentsGeometry(); g.setPositions(s);
    const b=new THREE.LineSegments2(g,BOLDMAT); b.visible=false;
    o.add(b); out.push(b);
  });
}
if(BOLDMAT){
  items.forEach(it=>{if(!it.bold)return;
    (Array.isArray(it.bold)?it.bold:[it.bold]).forEach(r=>boldify(r,it.boldClones));});
}

/* auto-register every leftover flat colour so it can be themed + clipped ----- */
(function(){
  scene.traverse(o=>{
    const m=o.material;
    if(!m||!m.color||m.map)return;
    if(painted.indexOf(m)>=0||m===MAT||m===MATF||m===LEAFLINE)return;
    if(SHADOW_MATS.indexOf(m)>=0)return;
    if(m.transparent&&m.opacity<0.30)return;
    const c=m.color.getHex();
    m.userData={d:c,n:new THREE.Color(c).multiplyScalar(0.55).getHex()};
    painted.push(m);
  });
})();

/* ============================================================================
   20. DAY / NIGHT  +  LAMP CONE
   ========================================================================= */
scene.background=new THREE.Color(C.bgD);
const coneA=new THREE.Vector3(pendX,pendShadeY-0.26,pendZ);
const conePlanes=[];
for(let k=0;k<30;k++){
  const ph=k*Math.PI/15;
  const n=new THREE.Vector3(-3.0*Math.cos(ph),-1.55,-3.0*Math.sin(ph)).normalize();
  const pl=new THREE.Plane(n,-n.dot(coneA));
  pl.userData={c:-n.dot(coneA)};
  conePlanes.push(pl);
}
const clipMats=[MAT,MATF,LINE_GLOW]; painted.forEach(m=>{if(clipMats.indexOf(m)<0)clipMats.push(m);});
clipMats.forEach(m=>{m.clippingPlanes=conePlanes;});
function setClip(on){for(const p of conePlanes)p.constant=on?p.userData.c:1e10;}
setClip(false);
function setFaint(on){
  MATF.visible=on; LEAFLINE.visible=on;
  SHADOW_MATS.forEach(m=>{m.visible=on;});
}
function setPass(mode){
  const night=(mode==='night');
  painted.forEach(m=>{m.color.set(night?m.userData.n:m.userData.d);});
  MAT.color.set(night?C.inkN:C.inkD);
  MATF.color.set(night?C.inkN:C.inkD);
  if(BOLDMAT)BOLDMAT.color.set(night?0xe8814f:0xd2603a);
}
function applyAudio(){
  RoomAudio.loop('dayAmb',!lightState.night&&winOpen);
  RoomAudio.loop('nightAmb',lightState.night&&winOpen);
}
function applyTheme(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  lightState.night=(lightState.force===null)?(h>=19||h<7):lightState.force;
  const night=lightState.night&&!lightState.switchOn;
  scene.background.set(night?C.bgN:C.bgD);
  setPass(night?'night':'lit');
  outDay.visible=!lightState.night;
  outNight.visible=lightState.night;
  document.body.classList.toggle('night',lightState.night&&!lightState.switchOn);
  RoomAudio.loop('hum',night&&lightState.switchOn);
  applyAudio();
  const hh=document.getElementById('hintTime');
  if(hh)hh.innerHTML=(lightState.night?'🌙 <b>夜间</b>':'☀ <b>白天</b>')+' · '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+
    (lightState.force===null?' · 自动':' · 手动')+
    (lightState.switchOn?' · 灯已开':'');
}
function renderNightLit(){
  const BG=scene.background;
  setClip(false); renderer.autoClear=true; renderer.render(scene,camera);
  setPass('lit'); setFaint(false); setClip(true);
  renderer.autoClear=false; scene.background=null;
  renderer.render(scene,camera);
  scene.background=BG; setClip(false); setFaint(true); setPass('night');
}

/* ============================================================================
   21. CAMERA — orbit + zoom, always framing the whole room
   ========================================================================= */
const view={az:Math.PI/4, el:0.53, zoom:1, tx:0.0, ty:1.95, tz:-0.35};
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
/* exact fit: binary-search the smallest distance that keeps all 8 room corners on screen */
const camFit=new THREE.PerspectiveCamera(40,1,0.1,400);
const FIT_CORNERS=[];
[-6,6].forEach(sx=>[-6,6].forEach(sz=>[0,6.95].forEach(sy=>FIT_CORNERS.push(new THREE.Vector3(sx,sy,sz)))));
const _p=new THREE.Vector3();
function placeCam(cam,d){
  const ce=Math.cos(view.el), se=Math.sin(view.el);
  cam.position.set(view.tx+d*ce*Math.sin(view.az), view.ty+d*se, view.tz+d*ce*Math.cos(view.az));
  cam.lookAt(view.tx,view.ty,view.tz);
  cam.updateMatrixWorld(true);
}
function cornersFit(d){
  camFit.fov=camera.fov; camFit.aspect=camera.aspect;
  camFit.updateProjectionMatrix(); placeCam(camFit,d);
  for(let i=0;i<FIT_CORNERS.length;i++){
    _p.copy(FIT_CORNERS[i]).project(camFit);
    if(_p.z>1||Math.abs(_p.x)>0.985||Math.abs(_p.y)>0.985)return false;
  }
  return true;
}
function fitDist(){
  let lo=6, hi=140;
  if(!cornersFit(hi))return hi;
  for(let i=0;i<26;i++){const mid=(lo+hi)/2; if(cornersFit(mid))hi=mid; else lo=mid;}
  return hi;
}
function updateCamera(){
  placeCam(camera, fitDist()*view.zoom);
}
window.__dbg=function(){
  camera.updateMatrixWorld(true);
  return {pos:camera.position.toArray().map(v=>+v.toFixed(2)),
    aspect:+camera.aspect.toFixed(3), iw:window.innerWidth, ih:window.innerHeight,
    fit:+fitDist().toFixed(2), zoom:view.zoom, target:[view.tx,view.ty,view.tz],
    corners:FIT_CORNERS.map(c=>{const p=c.clone().project(camera);
      return [+p.x.toFixed(2),+p.y.toFixed(2)];})};
};
/* Tooling hooks (read-only). These let external scripts (CDP) re-generate the
   profile README assets — the auto-drawing SVG and the capture GIFs — whenever
   the room changes. Nothing here is used by the room itself. */
window.__scene=scene;
window.__view=view;
window.__cam=function(){updateCamera();return camera.position.toArray();};
window.__items=items;
function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  if(BOLDMAT)BOLDMAT.resolution.set(window.innerWidth,window.innerHeight);
  updateCamera();
}
window.addEventListener('resize',onResize);

/* ============================================================================
   22. POINTER — pick, hover, tooltip, drag-orbit
   ========================================================================= */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let hovered=null, dragging=false, moved=0, lastX=0, lastY=0, px=0, py=0;
const tip=document.createElement('div');
tip.style.cssText='position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .15s;'+
  'padding:5px 10px;border-radius:9px;font-size:11.5px;letter-spacing:.03em;white-space:nowrap;'+
  'background:rgba(30,26,22,.86);color:#f7f3eb;box-shadow:0 4px 16px rgba(0,0,0,.22);';
document.body.appendChild(tip);
function pick(e){
  ndc.x=(e.clientX/window.innerWidth)*2-1;
  ndc.y=-(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(proxies,false);
  return hits.length?hits[0].object.userData.it:null;
}
function setHover(it){
  if(hovered===it)return;
  if(hovered)hovered.boldClones.forEach(b=>{b.visible=false;});
  hovered=it;
  if(hovered){
    hovered.boldClones.forEach(b=>{b.visible=true;});
    tip.textContent=hovered.name||''; tip.style.opacity=hovered.name?1:0;
    document.body.style.cursor='pointer';
  } else { tip.style.opacity=0; document.body.style.cursor=''; }
}
const cv=renderer.domElement;
cv.style.touchAction='none';
cv.addEventListener('pointerdown',e=>{
  RoomAudio.unlock();
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
  if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',e=>{
  px=e.clientX; py=e.clientY;
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    view.az=clamp(view.az-dx*0.0045,0.22,1.48);
    view.el=clamp(view.el+dy*0.0034,0.16,1.12);
    updateCamera();
  } else setHover(pick(e));
  if(tip.style.opacity==='1'){tip.style.left=(px+15)+'px';tip.style.top=(py+15)+'px';}
});
cv.addEventListener('pointerup',e=>{
  const wasDrag=dragging&&moved>7;
  dragging=false;
  if(!wasDrag){const it=pick(e);if(it&&it.action)it.action(it);}
});
cv.addEventListener('pointercancel',()=>{dragging=false;});
cv.addEventListener('pointerleave',()=>{dragging=false;setHover(null);});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  view.zoom=clamp(view.zoom*(1+e.deltaY*0.0012),0.58,1.95);
  updateCamera();
},{passive:false});

/* ============================================================================
   23. UI

(function(){
  const body=document.getElementById('panelBody');
  const groups=[
    ['房间',['门','窗户 · 推开','窗帘 · 左（拉上）','窗帘 · 右（拉上）']],

    ['工作台',['主显示器','竖屏副显示器','笔记本','键盘（敲代码）','鼠标','MIDI 键盘','戴上耳机（8-bit 音乐）','书桌抽屉 / 键盘托板','办公椅（推开）']],

let soundOn=true;
const bSound=document.getElementById('bSound');
bSound.addEventListener('click',()=>{
  soundOn=!soundOn; bSound.textContent=soundOn?'🔊':'🔇';
  bSound.classList.toggle('off',!soundOn);
  if(!soundOn){['dayAmb','nightAmb','hum','steam','plantSway','pcFan','chiptune','aquarium',
    'printer','lavaBubbles','fan'].forEach(n=>RoomAudio.loop(n,false));}
  else{applyTheme();RoomAudio.loop('steam',true);RoomAudio.loop('plantSway',true);}
});
document.getElementById('bList').addEventListener('click',()=>{
  document.getElementById('panel').classList.toggle('on');
});
document.getElementById('bView').addEventListener('click',()=>{
  view.az=Math.PI/4;view.el=0.53;view.zoom=1;updateCamera();
});
document.getElementById('hintTime').addEventListener('click',()=>{
  lightState.force = lightState.force===null ? false : (lightState.force===false ? true : null);
  applyTheme();
});

/* ============================================================================
   24. MAIN LOOP
   ========================================================================= */
let clockTime=0, themeT=9;
const clockT=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clockT.getDelta(),0.05);
  clockTime=clockT.elapsedTime;
  for(const it of items){
    if(it.p<it.target)      it.p=Math.min(it.target,it.p+dt*it.rate);
    else if(it.p>it.target) it.p=Math.max(it.target,it.p-dt*it.rate);
    it.v+=(it.tv-it.v)*Math.min(1,dt*2.2);
    if(it.apply) it.apply(it,dt,clockTime);
  }
  themeT+=dt; if(themeT>0.4){themeT=0;applyTheme();}
  if(lightState.night&&!lightState.switchOn&&pendIt.p>0.5) renderNightLit();
  else { renderer.autoClear=true; renderer.render(scene,camera); }
}
onResize();
applyTheme();
RoomAudio.loop('steam',true);
RoomAudio.loop('plantSway',true);
animate();
setTimeout(()=>{const l=document.getElementById('loader');if(l)l.classList.add('gone');},420);
})();
